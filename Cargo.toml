[package]
name = "cad-helper-3d"
version = "0.2.3"
edition = "2024"
license = "MIT"
description = "A sleek geometry and spacer calculator helper."

[package.metadata.deb]
# Let cargo-deb automatically inherit "cad-helper-3d" from the main package name
maintainer = "HangoverHGV"
depends = "$auto, libxkbcommon0, fontconfig"
section = "utils"
priority = "optional"

# Map project files into the Linux target paths
assets = [
    # 1. Install the binary
    ["target/release/cad-helper-3d", "usr/bin/cad-helper-3d", "755"],
    # 2. Install the app icon
    ["ui/assets/images/ico.svg", "usr/share/icons/hicolor/scalable/apps/cad-helper-3d.svg", "644"],
    # 3. Create the Desktop file shortcut launcher
    ["release/debian/cad-helper-3d.desktop", "usr/share/applications/cad-helper-3d.desktop", "644"]
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = "0.13.4"
scraper = { version = "0.27.0", features = ["serde", "atomic"] }
serde_json = "1.0.151"
slint = "1.16.1"
strum = { version = "0.28.0", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
printers = "2.3.0"
rfd = "0.17.2"

[build-dependencies]
slint-build = "1.16.1"
winres = "0.1.12"

[profile.release]
codegen-units = 1
lto = true
