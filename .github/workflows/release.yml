name: Public Release Publisher

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== 1. WINDOWS BUILD JOB ====================
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          key: "windows"

      - name: Compile and package using cargo-make
        run: cargo make build-windows

      - name: Upload temporary Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/windows/inventor-calculator-helper-setup.exe
          retention-days: 1

  # ==================== 2. ARCH LINUX PKG BUILD JOB ====================
  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch package dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            rustup \
            libxkbcommon \
            fontconfig \
            libxcb \
            git

      - name: Setup Rust toolchain
        run: |
          rustup default stable

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          key: "arch"

      - name: Build native package with makepkg via cargo-make
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "rustup default stable"
          su builder -c "cargo install --no-default-features --force cargo-make"
          su builder -c "cargo make build-arch"

      - name: Upload temporary Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: release/arch/*.pkg.tar.zst
          retention-days: 1

  # ==================== 3. DEBIAN BUILD JOB ====================
  build-debian:
    name: Build Debian Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ubuntu needs standard GUI build systems
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-make & cargo-deb
        run: |
          cargo install --no-default-features --force cargo-make
          cargo install cargo-deb

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          key: "debian"

      - name: Compile and Package debian build
        run: |
          cargo build --release --locked
          cargo make build-debian

      - name: Upload temporary Debian package
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: release/debian/*.deb
          retention-days: 1

  # ==================== 4. UNIFIED PUBLISH JOB ====================
  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-arch, build-debian] # Wait for all three platforms
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release folder
        run: mkdir -p release-assets

      # Download all three packages
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/

      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: release-assets/

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: release-assets/

      # Publish them onto a single page
      - name: Publish files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/inventor-calculator-helper-setup.exe
            release-assets/*.pkg.tar.zst
            release-assets/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}