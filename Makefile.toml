[config]
skip_core_tasks = true

[env]
# We dynamically pull the version directly from Cargo.toml via cargo-make's built-in env variable
APP_VERSION = "${CARGO_MAKE_CRATE_VERSION}"

# ==========================================
# 0.0 Sync DEV with the last master
# ==========================================
[tasks.sync]
description = "Commits local changes, pushes to origin, and dynamically syncs master and dev"
script = '''
#!/usr/bin/env bash

# Get the name of the current active branch
CURRENT_BRANCH=$(git branch --show-current)

# 1. Check for uncommitted local changes
if [ -n "$(git status --porcelain)" ]; then
    echo "=== Uncommitted changes detected on '$CURRENT_BRANCH' ==="
    read -r -p "Enter a commit message: " COMMIT_MSG

    # Abort if the message is left blank to prevent empty commits
    if [ -z "$COMMIT_MSG" ]; then
        echo "Error: Commit message cannot be empty. Aborting sync."
        exit 1
    fi

    # Add and commit the changes
    git add .
    git commit -m "$COMMIT_MSG"
fi

# 2. Push the current branch to origin (captures both new and existing unpushed commits)
echo "=== Pushing '$CURRENT_BRANCH' to remote ==="
git push origin "$CURRENT_BRANCH"

# 3. Execute dynamic merge logic
if [ "$CURRENT_BRANCH" = "dev" ]; then
    echo "=== Detected 'dev' branch. Merging dev into master ==="

    git checkout master
    git fetch origin master
    git merge origin/master --no-edit

    git merge dev --no-edit
    git push origin master

    echo "=== Sync complete. CURRENT BRANCH: master ==="

else
    echo "=== Detected '$CURRENT_BRANCH' branch. Merging master into dev ==="

    git checkout dev
    git fetch origin master

    # Brings in the master changes you just committed and pushed
    git merge origin/master --no-edit

    git push origin dev
    echo "=== Sync complete. CURRENT BRANCH: dev ==="
fi
'''

# ==========================================
# 0.1 Sync DEV with the last master
# ==========================================
[tasks.delete-last-tag]
description = "Finds the most recent release tag, deletes it locally, and removes it from the remote repository"
script_runner = "@shell"
script = '''
echo "=== Fetching latest tags from remote ==="
git fetch --tags --prune

# Get the most recent tag matching the 'v*' pattern
LAST_TAG=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null)

if [ -z "$LAST_TAG" ]; then
    echo "❌ Error: No tags matching 'v*' found in this repository."
    exit 1
fi

echo "Found target tag to delete: $LAST_TAG"

echo "=== Deleting tag locally ==="
git tag -d "$LAST_TAG"

echo "=== Deleting tag from remote origin ==="
git push origin --delete "$LAST_TAG"

echo "Successfully wiped $LAST_TAG from existence."
'''

# ==========================================
# 0.2 AUTO-TAGGING & DEPLOYMENT AUTOMATION
# ==========================================

[tasks.publish-version]
description = "Automatically tags the current commit with Cargo.toml version and pushes it to trigger CI/CD"
category = "Publish"
dependencies = ["git-check-clean"]
script_runner = "@shell"
script = [
    '''
    echo "=========================================================="
    echo "Automated Release Deployer starting..."
    echo "Target App Version: v${APP_VERSION}"
    echo "=========================================================="

    # Check if this Git tag already exists locally or on remote
    if git rev-parse "v${APP_VERSION}" >/dev/null 2>&1; then
        echo "Error: Git tag 'v${APP_VERSION}' already exists locally!"
        exit 1
    fi

    echo "Creating Git tag: v${APP_VERSION}"
    git tag -a "v${APP_VERSION}" -m "Release version ${APP_VERSION}"

    echo "Pushing tag to GitHub..."
    git push origin "v${APP_VERSION}"

    echo "Successfully tagged and pushed v${APP_VERSION}! GitHub Actions is now building your releases."
    '''
]

# Helper task to ensure you don't tag an uncommitted working directory
[tasks.git-check-clean]
private = true
script_runner = "@shell"
script = [
    '''
    if [ -n "$(git status --porcelain)" ]; then
        echo "Error: Working directory has uncommitted changes. Please commit or stash them first."
        exit 1
    fi
    '''
]

# ==========================================
# 1. ARCH LINUX TASKS
# ==========================================

[tasks.clean-arch]
description = "Clean up previous Arch Linux build artifacts"
condition = { platforms = ["linux"] }
script = [
    "echo 'Cleaning up old Arch packages...'",
    "cd release/arch && rm -rf pkg/ src/ *.pkg.tar.zst"
]

[tasks.build-arch]
description = "Build a clean, production-ready Arch Linux package"
condition = { platforms = ["linux"] }
dependencies = ["clean-arch"]
script_runner = "@shell"
script = [
    '''
    echo "Injecting Cargo.toml version ${APP_VERSION} into PKGBUILD..."
    cp release/arch/PKGBUILD release/arch/PKGBUILD.tmp
    sed -i "s/^pkgver=.*/pkgver=${APP_VERSION}/" release/arch/PKGBUILD.tmp

    echo "Generating clean Arch Linux installer..."
    cd release/arch
    makepkg -Cf -p PKGBUILD.tmp --skipinteg

    # Cleanup temporary files
    rm -f PKGBUILD.tmp
    rm -rf src/ pkg/
    echo "Arch Linux installer package created successfully in release/arch/"
    '''
]
# ==========================================
# 2. WINDOWS TASKS
# ==========================================

[tasks.clean-windows]
description = "Clean up previous Windows builds"
condition = { platforms = ["windows"] }
script_runner = "powershell"
script_extension = "ps1"
script = [
    "Write-Host 'Cleaning up old Windows artifacts...'",
    "if (Test-Path 'release/windows') { Remove-Item -Recurse -Force 'release/windows' }",
    "New-Item -ItemType Directory -Force -Path 'release/windows' | Out-Null"
]

[tasks.build-windows]
description = "Compile and generate a Windows Setup Installer"
condition = { platforms = ["windows"] }
dependencies = ["clean-windows"]
script_runner = "powershell"
script_extension = "ps1"
script = [
    "Write-Host 'Compiling natively for Windows (Release Mode)...'",
    "cargo build --release",

    "Write-Host 'Packaging assets for the installer...'",
    # 1. FIXED: Point to the new binary name generated by Cargo
    "Copy-Item 'target/release/cad-helper-3d.exe' 'release/windows/'",
    "New-Item -ItemType Directory -Force -Path 'release/windows/ui/images' | Out-Null",
    "Copy-Item -Path 'ui/images/*' -Destination 'release/windows/ui/images/' -Recurse",

    "Write-Host 'Copying installer configuration script...'",
    "Copy-Item 'build_assets/installer.iss' 'release/windows/'",

    "Write-Host 'Checking for Inno Setup Compiler...'",
    "$iscc = \"C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe\"",
    "if (-not (Test-Path $iscc)) {",
    "    Write-Warning 'Inno Setup compiler was not found at standard path!'" ,
    "    Write-Warning 'Please install it or check your installation path.'" ,
    "    exit 1",
    "}",

    "Write-Host 'Compiling Inno Setup Installer executable...'",
    "& $iscc release/windows/installer.iss",

    "Write-Host 'Windows Setup Wizard prepared successfully!'",
    # 2. FIXED: Log message reflecting the correct filename syntax
    "Write-Host 'Installer Output: release/windows/cad-helper-3d-setup.exe'"
]

# ==========================================
# 3. UNIVERSAL RELEASE AUTOMATION
# ==========================================

[tasks.release-all]
description = "Detects the OS platform and runs the correct build scripts"
run_task = [
    { name = "build-windows", condition = { platforms = ["windows"] } },
    # Runs BOTH Arch and Debian builds if compiled on Linux
    { name = "build-linux-packages", condition = { platforms = ["linux"] } }
]

[tasks.build-linux-packages]
dependencies = [
    "build-arch",
    "build-debian"
]

# ==========================================
# 4. DEBIAN TASKS
# ==========================================

[tasks.clean-debian]
description = "Clean up previous Debian packages"
condition = { platforms = ["linux"] }
script = [
    "echo 'Cleaning up old Debian packages...'",
    "rm -rf target/debian/ release/debian/*.deb"
]

[tasks.build-debian]
description = "Build a clean, production-ready Debian (.deb) package"
condition = { platforms = ["linux"] }
dependencies = ["clean-debian"]
script_runner = "@shell"
script = [
    '''
    echo "Compiling release binary..."
    cargo build --release

    echo "Generating clean Debian package..."
    # We can keep --no-build now because we just built it manually above
    cargo deb --no-build
    mkdir -p release/debian

    # Copy specifically matching package name utilizing the dynamic variable
    cp target/debian/*${APP_VERSION}*.deb release/debian/
    echo "Debian package version ${APP_VERSION} created successfully in release/debian/"
    '''
]