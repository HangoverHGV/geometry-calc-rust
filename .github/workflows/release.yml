name: Public Release Publisher

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== 1. WINDOWS BUILD JOB ====================
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          key: "windows"

      - name: Compile and package using cargo-make
        run: cargo make build-windows

      - name: Upload temporary Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/windows/cad-helper-3d-setup.exe
          retention-days: 1

  # ==================== 2. UNIFIED PUBLISH JOB ====================
  publish-release:
    name: Create GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare release folder
        run: mkdir -p release-assets

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/

      # Publish Windows installer to GitHub Release
      - name: Publish files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cad-helper-3d-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}