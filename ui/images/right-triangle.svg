<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Styles for lines and text -->
  <style>
    .line { stroke: #2563eb; stroke-width: 4; fill: none; stroke-linecap: butt; }
    .square-marker { stroke: #2563eb; stroke-width: 2.5; fill: none; }
    .label { fill: black; font-family: 'Open Sans', sans-serif; font-size: 24px; text-anchor: middle; }
  </style>

  <!-- Triangle Lines (Blue) -->
  <!-- Leg AB (Vertical) -->
  <line x1="100" y1="200" x2="100" y2="100" class="line" />
  <!-- Leg AC (Horizontal) -->
  <line x1="100" y1="200" x2="250" y2="200" class="line" />
  <!-- Hypotenuse BC -->
  <line x1="100" y1="100" x2="250" y2="200" class="line" />

  <!-- Right Angle Marker at Vertex A (Blue) -->
  <line x1="100" y1="180" x2="120" y2="180" class="square-marker" />
  <line x1="120" y1="180" x2="120" y2="200" class="square-marker" />

  <!-- ABC Text Labels (Black) -->
  <!-- A (Bottom-Left) -->
  <text x="80" y="215" class="label">A</text>

  <!-- B (Top-Left) -->
  <text x="80" y="105" class="label">B</text>

  <!-- C (Bottom-Right) -->
  <text x="260" y="215" class="label">C</text>
</svg>
