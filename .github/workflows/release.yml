name: Public Release Publisher

on:
  push:
    # This ensures the build only runs when you push a version tag like v1.0.0, v1.1.5, etc.
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== WINDOWS BUILD JOB ====================
  build-windows:
    name: Build Windows Installer (MSVC)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Install cargo-make
        uses: davidB/rust-cargo-make-action@v1

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          key: "windows"

      - name: Compile and package using cargo-make
        run: cargo make build-windows

      # 👇 This step uploads the completed .exe directly to the GitHub Release!
      - name: Publish Windows Installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/windows/inventor-calculator-helper-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================== ARCH LINUX PKG BUILD JOB ====================
  build-arch:
    name: Build Arch Linux (.pkg.tar.zst)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch package dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            rustup \
            libxkbcommon \
            fontconfig \
            libxcb \
            git

      - name: Setup Rust toolchain
        run: |
          rustup default stable

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          key: "arch"

      - name: Build native package with makepkg via cargo-make
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          su builder -c "cargo install --no-default-features --force cargo-make"
          su builder -c "cargo make build-arch"

      # 👇 This step uploads the compiled pacman package directly to the GitHub Release!
      - name: Publish Arch Package to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/arch/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}