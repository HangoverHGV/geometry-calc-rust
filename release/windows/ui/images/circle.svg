<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer boundary box representing an object -->
  <rect x="15" y="15" width="70" height="70" rx="8" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4 4" />

  <!-- Center Target Marker -->
  <circle cx="50" cy="50" r="12" fill="none" stroke="#2563eb" stroke-width="4" />
  <circle cx="50" cy="50" r="3" fill="#2563eb" />

  <!-- Crosshairs extending out slightly to show center lines -->
  <line x1="50" y1="25" x2="50" y2="75" stroke="#2563eb" stroke-width="2" />
  <line x1="25" y1="50" x2="75" y2="50" stroke="#2563eb" stroke-width="2" />
</svg>
