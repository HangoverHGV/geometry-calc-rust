name: Public Release Publisher

on:
  push:
    # Trigger only when you push a version tag like v1.0.0
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== 1. WINDOWS BUILD JOB ====================
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      # 👇 Fixed: Changed "davidB/rust-cargo-make-action@v1" to the correct repo
      - name: Install cargo-make
        uses: davidB/rust-cargo-make@v1

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          key: "windows"

      - name: Compile and package using cargo-make
        run: cargo make build-windows

      # Save the compiled .exe installer temporarily
      - name: Upload temporary Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/windows/inventor-calculator-helper-setup.exe
          retention-days: 1

  # ==================== 2. ARCH LINUX PKG BUILD JOB ====================
  build-arch:
    name: Build Arch Linux Package
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arch package dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
            base-devel \
            rustup \
            libxkbcommon \
            fontconfig \
            libxcb \
            git

      - name: Setup Rust toolchain
        run: |
          rustup default stable

      - name: Cache Cargo Registry & Build
        uses: Swatinem/rust-cache@v2
        with:
          key: "arch"

      # We manually install cargo-make using 'cargo install' inside the Arch container
      # directly so we don't have to worry about container/runner action incompatibilities.
      - name: Build native package with makepkg via cargo-make
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .
          
          # Install cargo-make directly into the Arch environment
          su builder -c "cargo install --no-default-features --force cargo-make"
          
          # Execute your build-arch task
          su builder -c "cargo make build-arch"

      # Save the compiled .pkg.tar.zst package temporarily
      - name: Upload temporary Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: release/arch/*.pkg.tar.zst
          retention-days: 1

  # ==================== 3. UNIFIED PUBLISH JOB ====================
  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-arch] # Wait for both builds to finish successfully
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and upload assets

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Create a clean release directory to gather the assets
      - name: Prepare release folder
        run: mkdir -p release-assets

      # Download the Windows .exe from the first job
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets/

      # Download the Arch .pkg.tar.zst from the second job
      - name: Download Arch package
        uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: release-assets/

      # Upload BOTH files together to the public Release page
      - name: Publish files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/inventor-calculator-helper-setup.exe
            release-assets/*.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}