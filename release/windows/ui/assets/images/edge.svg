<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
    <!-- The Object Box -->
    <rect x="35" y="20" width="50" height="60" rx="6" fill="none" stroke="#64748b" stroke-width="3" />

    <!-- The Starting Edge Line (Highlighted in Blue) -->
    <line x1="35" y1="10" x2="35" y2="90" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />

    <!-- Measurement/Dimension Arrow starting exactly from that edge -->
    <line x1="35" y1="50" x2="80" y2="50" stroke="#2563eb" stroke-width="3" />
    <polygon points="75,44 87,50 75,56" fill="#2563eb" />
</svg>
